name: CI

on:
  push:
    branches: [main, develop, dependabot/develop]
  pull_request:
    branches: [main, develop, dependabot/develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Run ESLint 👀
        run: npm run lint

      - name: Run Typecheck 🧪
        run: npm run typecheck

      - name: Check Prettier ✨
        run: npm run prettier:check
